name: public
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -VV
      - run: python -m pip install -r requirements.txt
      - run: python3 build_registry.py
      - run: git diff --exit-code
      - run: |
          set +e
          python3 -m skillkit check --provenance public --format json > check.json
          s=$?
          cat check.json
          exit $s
        shell: bash
      - run: python3 -m skillkit gen --check --provenance public
      - run: python3 -m skillkit lint privacy --no-baseline
      - run: python3 -m unittest discover -s tests -t .
      - run: bash -n scripts/*.sh bin/tisserand
      - run: python3 -m py_compile build_registry.py scripts/*.py
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: clone into an empty directory (no workspace caches)
        run: git clone --no-local --depth 1 "file://$GITHUB_WORKSPACE" "$RUNNER_TEMP/fresh"
      - name: README quick start, verbatim
        working-directory: ${{ runner.temp }}/fresh
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m skillkit check
          python -m skillkit gen --check
          python -m unittest discover -s tests -t .
      - name: no untracked output
        working-directory: ${{ runner.temp }}/fresh
        run: test -z "$(git status --porcelain --untracked-files=no)"
