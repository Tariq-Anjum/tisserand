# Objective: J = 0.5*top1_acc + 0.2*(1-hard_neg_fp_rate) + 0.2*abstain_f1 + 0.1*composition_f1 (undefined term = 0)
# 86016 candidates evaluated; dev objective 0.4286.

schema = 1

