# Neutrality term list (manifest spec 5.1, RULES A7).
# Names of specific harnesses, agents, model vendors and model names.
# This file and policy/privacy-allow.toml are the only places such names may
# appear in the product repo; the zones file marks them exempt.
#   word-ci  case-insensitive, whole word
#   word-cs  case-sensitive, whole word (ambiguous common words such as a
#            product name that is also an ordinary noun or a bare acronym)
# "Whole word" = not adjacent to an ASCII letter or digit, so GPT-4 and
# CLAUDE.md match while 'Piping' does not match Pi.
# Seeded from a read-only census of the repository text plus the well-known
# names of the same kinds; extend deliberately when a new host or model
# family appears.

