schema = 1
id = "decision-interview"
kind = "judgment"
type = "skill"
category = "planning"
# explicit: interview-only and started only when named (coherence plan final
# section 3). rubric 4.4 never infers it; unnamed clarify work stays with
# intent-contract, which already excludes named interviews.
activation = "explicit"
# low: interview mode writes nothing; record mode appends to one safe target,
# only on request (SKILL.md Record mode).
risk = "low"
version = "0.1.0"
# One release only. Kept so the frozen router's name detector still routes the
# old name; registry/migrations.toml holds the permanent record (validator:
# a live alias is allowed only when its owner equals the resolved target).
# The alias opens interview mode. grill-with-docs is retired (migrations.toml).
aliases = ["grill-me"]

task_types = ["clarify", "document"]

[routing]
provides = ["branch-interview", "branch-ledger", "pinned-terms", "decision-records"]
# Authored from capability text; no
# source phrasing. Avoids neighbour terms: definition of done, scope is
# unclear, success criteria, plan file, decisions log.
intents = ["question each open branch", "pin terms and record decisions"]
phrases = ["one question per turn"]
# limit 2: the clarify row's NOT-this (shape -> design) and ordering (plan).
# Building and the unnamed case are type/activation boundaries (SKILL.md).
exclusions = ["solution shape", "ordering the steps"]
requires = []

[cost]
latency = "low"

[access]  # unreviewed placeholder (manifest spec 11.2); enforcement arrives with P5
# record mode appends to one safe target (fs write-scoped); shell read only to
# see whether a target file holds changes it did not make.
fs = "write-scoped"
network = "none"
shell = "read"
secrets = "none"
privilege = "none"

[provenance]
# Original text written clean-room on 2026-11-09 from active idea cards
# mattpocock-01, gstack-04 and pwf-01 (mechanisms only). Replaces the
# provenance of the two merged entries. What changes: their legacy
# derivation comments become the inspired_by entry below with disposition
# INDEPENDENT and an evidence_ref; LicenseRef-unverified becomes MIT; notes_ref
# moves to the T2 notes. Earlier revisions stay in history: the history
# comparison under evidence_ref governs THIRD_PARTY_NOTICES, not this field.
origin = "original"
license = "MIT"
disposition = "INDEPENDENT"
evidence_ref = "ev:lic:compare.dispositions"
verified = "2026-11-09"
notes_ref = "ev:note:t2-b1"

[[provenance.inspired_by]]
name = "mattpocock/skills"
url = "https://github.com/mattpocock/skills"
sha = "4ae2317d"
licence = "MIT"
date = "2026-11-09"
