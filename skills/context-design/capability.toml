schema = 1
id = "context-design"
kind = "judgment"
type = "skill"
category = "meta"
# contextual (model-invoked): design on the agent artifact is inferred from
# task text (taxonomy A1 agent cues "context loading", "context window",
# "skill registry"; A2 design cues). Keeps the design [agent] PRIMARY of the
# entry it replaces.
activation = "contextual"
# low: reads the workspace and writes only its load map (SKILL.md Quick Index).
risk = "low"
version = "0.1.0"
# One release only. Kept so the frozen router's name detector still routes the
# old name; registry/migrations.toml holds the permanent record (validator:
# a live alias is allowed only when its owner equals the resolved target).
aliases = ["context-fundamentals"]

task_types = ["design", "debug"]

[routing]
provides = ["load-map", "context-tiers", "context-budget", "load-trace"]
# Authored from capability text; no source
# phrasing. Avoids neighbour terms: page layout, architecture, install,
# binding, documentation drift, root cause.
intents = ["decide what an agent loads", "tier agent context sources", "set a context byte budget", "trace why context loaded"]
phrases = ["load map", "context budget", "on demand loading", "always loaded"]
# limit 2: setup (installing a capability) and non-agent design (app code).
# Both are type or artifact boundaries, so no cell cap (rubric 4.2).
exclusions = ["installing a capability", "app code architecture"]
requires = []

[cost]
latency = "low"

[access]  # unreviewed placeholder (manifest spec 11.2); enforcement arrives with P5
# writes only its own map file when a later stage reads it (fs write-scoped);
# shell read for size counts and load traces.
fs = "write-scoped"
network = "none"
shell = "read"
secrets = "none"
privilege = "none"

[provenance]
# Clean-room rewrite (2026-11-09) under a new id; original text from active
# idea cards aspec-01, aspec-02, pwf-01 (mechanisms only) and the owner's
# Context and Resource Discipline rules. Replaces the provenance of the
# renamed entry. What changes: its legacy derivation comment (a condensed
# summary of one upstream collection) is not carried; it becomes the
# inspired_by entry below with disposition INDEPENDENT and an evidence_ref;
# LicenseRef-unverified becomes MIT. Earlier revisions stay in history; the
# history comparison under evidence_ref governs THIRD_PARTY_NOTICES.
origin = "original"
license = "MIT"
disposition = "INDEPENDENT"
evidence_ref = "ev:lic:compare.dispositions"
verified = "2026-11-09"
notes_ref = "ev:note:t2-b1"

[[provenance.inspired_by]]
name = "muratcankoylan/Agent-Skills-for-Context-Engineering"
url = "https://github.com/muratcankoylan/Agent-Skills-for-Context-Engineering"
sha = "9ff0c991"
licence = "MIT"
date = "2026-11-09"
