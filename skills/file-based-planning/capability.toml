schema = 1
id = "file-based-planning"
kind = "judgment"
type = "skill"
category = "planning"
# contextual: both cells need long_running and stay SUPPORTING (F2), so it
# attaches beside the plan PRIMARY and the named handoff; never PRIMARY.
activation = "contextual"
# low: writes only its own state files in a safe place (SKILL.md step 1).
risk = "low"
priority = "foundational"
version = "0.2.0"

task_types = ["plan", "handoff"]

[routing]
provides = ["progress-file", "resume-state", "dead-end-log"]
# Authored from capability text; no
# source phrasing. Drops planning (shared with a pointer), findings and
# decisions vocabulary (shared with reconciliation work).
intents = ["keep task progress in files", "resume a long task from disk", "survive a reset or crash"]
phrases = ["progress file", "pick up where", "after a crash"]
# limit 2: one-exchange work (SKILL.md Boundaries) and reconciliation
# (document), the measured lexical neighbour.
exclusions = ["single shot", "reconcile"]
requires = []

[cost]
latency = "low"

[access]  # unreviewed placeholder (manifest spec 11.2); enforcement arrives with P5
# writes its own state files in one safe place (fs write-scoped); shell read
# only to see whether a target file holds changes it did not make.
fs = "write-scoped"
network = "none"
shell = "read"
secrets = "none"
privilege = "none"

[provenance]
# Original text written clean-room on 2026-11-09 from active idea cards
# pwf-01, suite32-03 and addy-04 (mechanisms only). What changes: the legacy
# derivation comments become the inspired_by entry below with disposition
# INDEPENDENT and an evidence_ref; LicenseRef-unverified becomes MIT;
# notes_ref moves to the T2 notes. Earlier revisions stay in history: the
# history comparison under evidence_ref governs THIRD_PARTY_NOTICES, not
# this field.
origin = "original"
license = "MIT"
disposition = "INDEPENDENT"
evidence_ref = "ev:lic:compare.dispositions"
verified = "2026-11-09"
notes_ref = "ev:note:t2-b2"

[[provenance.inspired_by]]
name = "OthmanAdi/planning-with-files"
url = "https://github.com/OthmanAdi/planning-with-files"
sha = "2362ca38"
licence = "MIT"
date = "2026-11-09"
