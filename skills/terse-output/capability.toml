schema = 1
id = "terse-output"
kind = "judgment"
type = "skill"
category = "productivity"
# explicit modifier: never inferred, no task_types, never rated (coherence
# plan section 6; taxonomy section 1 modifiers).
activation = "explicit"
risk = "low"
version = "0.2.0"

[routing]
# concise-replies replaces token-efficiency, which the caveman pointer also
# provides; the rest is kept. No source phrasing.
provides = ["communication", "concise-replies"]
intents = ["shorter replies", "cut the verbose prose"]
phrases = ["shorter replies"]
exclusions = []

[cost]
latency = "low"

[access]  # unreviewed placeholder (manifest spec 11.2); enforcement arrives with P5
# changes only how replies are worded: reads nothing extra, writes nothing.
fs = "none"
network = "none"
shell = "none"
secrets = "none"
privilege = "none"

[provenance]
# Original text written clean-room on 2026-11-09 from active idea card cav-01
# (mechanism only). What changes: the legacy derivation comments become the
# inspired_by entry below with disposition INDEPENDENT and an evidence_ref;
# LicenseRef-unverified becomes MIT; notes_ref moves to the T2 notes. The
# upstream licence (Apache-2.0 at the pin) matches the caveman pointer.
# Earlier revisions stay in history: the history comparison under
# evidence_ref governs THIRD_PARTY_NOTICES, not this field.
origin = "original"
license = "MIT"
disposition = "INDEPENDENT"
evidence_ref = "ev:lic:compare.dispositions"
verified = "2026-11-09"
notes_ref = "ev:note:t2-b2"

